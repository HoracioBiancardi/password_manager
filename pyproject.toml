[project]
name = "ps-manager-v2"
version = "2.0.0"
description = "PS Manager V2 — Secure Password Vault (SwordPower Web App)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.0.0",
    "cryptography>=42.0.0",
    "aiofiles>=25.1.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
ps-manager = "ps_manager.main:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ps_manager"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
